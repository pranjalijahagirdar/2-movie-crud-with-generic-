    <div class="backDrop formClose" id="backDrop"></div>
<form id="movieForm">
    <div class="card">
        <div class="card-header d-flex justify-content-between">
            <h5  id="movieFormTitle">Add Movie</h5>
            <i class="fa-solid fa-xmark formClose"
                id="closeForm"
                role="button"></i>
        </div>
        <div class="card-body">
            <div class="form-group">
                <label for="title">
                    Movie Title
                </label>
                <input
                    type="text"
                    class="form-control"
                    id="title"
                    required
                >
            </div>
            <div class="form-group">
                <label for="poster">
                    Poster
                </label>
                <input
                    class="form-control"
                    type="text"
                    id="poster"
                >
            </div>
            <div class="form-group">
                <label for="description">
                    Description
                </label>
                <textarea
                    class="form-control"
                    rows="4"
                    id="description">
                </textarea>
            </div>
            <div class="form-group">
                <label for="rating">
                    Rating
                </label>
                <select
                    class="form-control"
                    id="rating" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
            <div class="form-group">
                <label for="genre">
                    Genre
                </label>
                <select
                    class="form-control"
                    id="genre" required>

                    <option value="Action">Action</option>
                    <option value="Adventure">Adventure</option>
                    <option value="Emotional">Emotional</option>
                    <option value=""></option>
                    <option value="Drama">Drama</option>
                    <option value="Horror">Horror</option>
                    <option value="Sci-Fi">Sci-Fi</option>

                </select>
            </div>
        </div> 
        <div class="card-footer d-flex justify-content-between">
            <button
                type="submit"
                id="movieAddbtn"
                class="btn btn-sm net-sec-btn">
                Add Movie
            </button>
            <button
                type="button"
                id="UpdatemovieBtn"
                class="btn btn-sm net-sec-btn d-none">
                Update Movie
            </button>
            <button
                type="button"
                class="btn btn-sm net-pri-btn formClose">
                Cancel
            </button>
</div>
        </div>
        </form>
